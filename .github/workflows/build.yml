name: build

# An architecture per job, each starting from its cached prefix. A push to library
# publishes one release, tagged with the date and commit.
on:
  push:
    branches: [library]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: android, arch: arm64 }
          - { platform: android, arch: armv7l }
          - { platform: android, arch: x86_64 }
          - { platform: windows, arch: x86_64 }
          - { platform: windows, arch: aarch64 }
          - { platform: macos, arch: arm64 }
          - { platform: macos, arch: x86_64 }
    steps:
      - uses: actions/checkout@v7

      - name: Install the build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config ninja-build nasm
          pipx install meson==1.12.1
      - name: Install the build tools
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config ninja nasm gnu-sed coreutils cargo-c
          pipx install meson==1.12.1

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6

      - uses: actions/cache@v6
        with:
          path: prefix/${{ matrix.platform }}-${{ matrix.arch }}
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('sources.sh', 'build.sh', 'scripts/**', 'recipes/**') }}
          restore-keys: ${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Build
        env:
          GRADLE_OPTS: -Xmx4G
        run: |
          unset ANDROID_SDK_ROOT ANDROID_HOME
          ./build.sh ${{ matrix.platform }} ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: out/*
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: built

      - name: Join the AARs and hash the files
        run: |
          mkdir -p out joined
          # Each holds its own ABI, the rest is the same.
          unzip -q built/android-arm64/libmpv-android.aar -d joined
          for arch in armv7l x86_64; do unzip -q -o built/android-$arch/libmpv-android.aar 'jni/*' -d joined; done
          (cd joined && zip -q -r -X ../out/libmpv-android.aar .)
          cp built/{windows,macos}-*/*.zip out/
          (cd out && sha256sum * | tee SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: out
          compression-level: 0

      - name: Publish the release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/library'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          {
            echo 'Built from these sources:'
            echo
            sed -n 's/^v_\([a-z0-9_]*\)=\([^ ]*\).*$/- \1: \2/p' sources.sh
            echo
            echo 'SHA-256:'
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } >notes.md
          gh release create "$tag" out/* --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
